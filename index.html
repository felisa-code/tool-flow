<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手工具進銷存管理系統</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#eef6fb;color:#17354b}button,input,select{font:inherit;padding:10px;border:1px solid #c4dce8;border-radius:8px}button{cursor:pointer;background:#087eae;color:white;border:0}button:hover{filter:brightness(1.12)}aside{background:#07354e;color:white;padding:24px 16px;width:235px;position:fixed;inset:0 auto 0 0;overflow:auto}aside button{display:block;width:100%;text-align:left;margin:6px 0;background:transparent}aside button.active,aside button:hover{background:#12668a}main{margin-left:235px;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:25px}h2{font-size:19px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}.card,section{background:white;border:1px solid #d6e8f1;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #0a608009}.metric{font-size:32px;color:#087eae;font-weight:bold}.muted{color:#668395;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:13px;border-bottom:1px solid #e2edf3}th{background:#eaf6fc}td button{padding:6px 10px;margin-right:5px}.danger{background:#a33c48}.secondary{background:#52788c}.warn{color:#a64e00;font-weight:bold}dialog{border:0;border-radius:15px;width:min(520px,94vw);padding:24px;box-shadow:0 20px 80px #00354b55}dialog::backdrop{background:#07354e88}label{display:grid;gap:5px;margin:12px 0}label input,label select{width:100%}#login{max-width:430px;margin:10vh auto;padding:32px;background:white;border-radius:20px}#login button{width:100%}#toast{position:fixed;bottom:20px;right:20px;background:#07354e;color:white;padding:14px;border-radius:10px;display:none}.bar{height:14px;background:#21a5d0;border-radius:8px;margin:5px 0 15px}@media(max-width:700px){aside{position:static;width:100%;padding:12px;display:flex;flex-wrap:wrap;gap:4px}aside h2,aside p{width:100%;margin:5px}aside button{width:auto;margin:0}main{margin:0;padding:14px}header{flex-wrap:wrap}}
</style><body><div id="login"><h1>TOOL FLOW</h1><p>手工具進銷存管理系統 · 模擬環境</p><form id="loginForm"><label>帳號<input id="account" required value="admin"></label><label>密碼<input id="password" type="password" required value="demo123"></label><button>登入系統</button></form><p class="muted">示範帳號：admin／staff／viewer，密碼皆為 demo123。請勿輸入真實密碼或機密資料。</p></div><div id="app" hidden><aside id="nav"></aside><main><header><div><div class="muted" id="company"></div><h1 id="heading"></h1></div><div><span id="identity"></span> <button class="secondary" onclick="logout()">登出</button></div></header><div id="content"></div></main></div><dialog id="modal"><form id="editor"><h2 id="modalTitle"></h2><div id="fields"></div><div class="toolbar"><button type="submit">儲存</button><button type="button" class="secondary" onclick="document.getElementById('modal').close()">取消</button></div></form></dialog><div id="toast"></div><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), today=()=>new Date().toLocaleDateString('sv-SE'), uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
const seed=()=>({company:'精工手工具有限公司',vendors:[{id:'v1',name:'宏泰工具',type:'供應商',contact:'王先生'},{id:'v2',name:'聯合五金',type:'客戶',contact:'林小姐'}],products:[{id:'p1',sku:'TL-001',name:'棘輪扳手',spec:'1/2 吋',brand:'示範品牌',unit:'支',min:15},{id:'p2',sku:'TL-002',name:'十字起子',spec:'PH2 × 150 mm',brand:'示範品牌',unit:'支',min:20},{id:'p3',sku:'TL-003',name:'尖嘴鉗',spec:'6 吋',brand:'示範品牌',unit:'支',min:10}],tx:[{id:'t1',no:'IN-001',type:'入貨',vendor:'v1',product:'p1',qty:60,date:today(),created:today(),note:'期初示範'},{id:'t2',no:'IN-002',type:'入貨',vendor:'v1',product:'p2',qty:18,date:today(),created:today(),note:''},{id:'t3',no:'IN-003',type:'入貨',vendor:'v1',product:'p3',qty:35,date:today(),created:today(),note:''},{id:'t4',no:'OUT-001',type:'出貨',vendor:'v2',product:'p1',qty:12,date:today(),created:today(),note:''}],users:[{id:'u1',name:'admin',role:'管理員'},{id:'u2',name:'staff',role:'作業員'},{id:'u3',name:'viewer',role:'唯讀'}]});
let db;try{db=JSON.parse(localStorage.getItem('toolflow-v1'))||seed()}catch{db=seed()}let user=null,page='首頁儀表板',q='',from='',to='';const pages=['首頁儀表板','廠商管理','手工具管理','入貨管理','出貨管理','庫存管理','交易紀錄','報表管理','帳號管理','系統設定'];const save=()=>localStorage.setItem('toolflow-v1',JSON.stringify(db));const stock=(id,tx=db.tx)=>tx.filter(t=>t.product===id).reduce((s,t)=>s+(t.type==='入貨'?1:-1)*Number(t.qty),0);const name=(arr,id)=>arr.find(x=>x.id===id)?.name||'未知';const can=()=>user?.role!=='唯讀';const admin=()=>user?.role==='管理員';function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
$('loginForm').onsubmit=e=>{e.preventDefault();user=db.users.find(u=>u.name===$('account').value&&$('password').value==='demo123');if(!user){toast('帳號或密碼錯誤');return} $('login').hidden=true;$('app').hidden=false;go('首頁儀表板')};function logout(){user=null;$('app').hidden=true;$('login').hidden=false}function go(p){page=p;q='';from='';to='';render()}function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length}">沒有符合的資料</td></tr>`}</tbody></table></div>`}function actions(k,id){return can()&&(k!=='users'||admin())?`<button onclick="edit('${k}','${id}')">編輯</button><button class="danger" onclick="removeRow('${k}','${id}')">刪除</button>`:''}function match(x){return JSON.stringify(x).toLowerCase().includes(q.toLowerCase())}function txs(type){return db.tx.filter(t=>(!type||t.type===type)&&(!from||t.date>=from)&&(!to||t.date<=to)&&match({...t,vendorName:name(db.vendors,t.vendor),productName:name(db.products,t.product),spec:db.products.find(p=>p.id===t.product)?.spec}))}function toolbar(k,type){return `<div class="toolbar">${k&&k!=='report'&&can()?`<button onclick="edit('${k}','','${type||''}')">＋ 新增</button>`:''}<input placeholder="搜尋關鍵字" value="${esc(q)}" onchange="q=this.value;render()"><button class="secondary" onclick="q='';from='';to='';render()">清除篩選</button>${['tx','report'].includes(k)||page==='交易紀錄'?`<input aria-label="起始日期" type="date" value="${from}" onchange="from=this.value;render()"><input aria-label="結束日期" type="date" value="${to}" onchange="to=this.value;render()">`:''}</div>`}function txTable(ts){return table(['單號','類型','廠商','品名','規格','數量','交易日期','建單日期','備註','操作'],ts.map(t=>[esc(t.no),t.type,esc(name(db.vendors,t.vendor)),esc(name(db.products,t.product)),esc(db.products.find(p=>p.id===t.product)?.spec),t.qty,esc(t.date),esc(t.created),esc(t.note),actions('tx',t.id)]))}function render(){if(!user)return;$('company').textContent=db.company+' ｜ DEMO';$('heading').textContent=page;$('identity').textContent=user.name+' · '+user.role;$('nav').innerHTML='<h2>◈ TOOL FLOW</h2><p class="muted">手工具管理平台</p>'+pages.filter(p=>admin()||!['帳號管理','系統設定'].includes(p)).map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('');let h='';const sum=type=>db.tx.filter(t=>t.type===type).reduce((s,t)=>s+Number(t.qty),0);if(page===pages[0]){h='<div class="cards">'+[['商品品項',db.products.length],['累計入貨',sum('入貨')],['累計出貨',sum('出貨')],['低庫存品項',db.products.filter(p=>stock(p.id)<=p.min).length]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="metric">${b}</div></div>`).join('')+'</div><section><h2>庫存概況</h2>'+db.products.map(p=>`<div>${esc(p.name)} · ${stock(p.id)} ${esc(p.unit)}</div><div class="bar" style="width:${Math.max(0,stock(p.id))/Math.max(1,...db.products.map(p=>stock(p.id)))*100}%"></div>`).join('')+'</section><section><h2>近期交易</h2>'+txTable(db.tx.slice(-5).reverse())+'</section>'}else if(page===pages[1])h=toolbar('vendors')+table(['廠商名稱','類型','聯絡資訊','操作'],db.vendors.filter(match).map(v=>[esc(v.name),esc(v.type),esc(v.contact),actions('vendors',v.id)]));else if(page===pages[2])h=toolbar('products')+table(['編號','品名','規格','品牌','單位','安全庫存','操作'],db.products.filter(match).map(p=>[esc(p.sku),esc(p.name),esc(p.spec),esc(p.brand),esc(p.unit),p.min,actions('products',p.id)]));else if([pages[3],pages[4],pages[6]].includes(page)){let type=page===pages[3]?'入貨':page===pages[4]?'出貨':'';h=toolbar(type?'tx':null,type)+txTable(txs(type))}else if(page===pages[5])h=toolbar()+table(['商品編號','品名','規格','現有庫存','安全庫存','狀態'],db.products.filter(match).map(p=>[esc(p.sku),esc(p.name),esc(p.spec),stock(p.id)+' '+esc(p.unit),p.min,stock(p.id)<=p.min?'<span class="warn">低庫存</span>':'正常']));else if(page===pages[7]){let ts=txs();h=toolbar('report').replace(/<button onclick="edit\('report'.*?<\/button>/,'')+`<button onclick="exportCSV()">匯出 CSV</button><div class="cards">${['入貨','出貨'].map(t=>`<div class="card">${t}數量<div class="metric">${ts.filter(x=>x.type===t).reduce((s,x)=>s+Number(x.qty),0)}</div></div>`).join('')}</div>`+txTable(ts)}else if(page===pages[8]&&admin())h=toolbar('users')+table(['帳號','角色','操作'],db.users.filter(match).map(u=>[esc(u.name),esc(u.role),actions('users',u.id)]));else if(page===pages[9]&&admin())h=`<section><label>公司名稱<input id="companyEdit" value="${esc(db.company)}"></label><button onclick="db.company=$('companyEdit').value.trim()||db.company;save();render();toast('已儲存')">儲存設定</button></section><section><h2>資料備份</h2><div class="toolbar"><button onclick="download('toolflow-backup.json',JSON.stringify(db,null,2),'application/json')">下載備份</button><button class="danger" onclick="if(confirm('確定清除目前資料並恢復示範資料？')){db=seed();save();logout()}">重設示範資料</button></div><label>還原 JSON 備份<input type="file" accept=".json" onchange="restore(this)"></label></section>`;$('content').innerHTML=h}
const schemas={vendors:[['name','廠商名稱'],['type','類型',['供應商','客戶','兩者皆是']],['contact','聯絡資訊']],products:[['sku','商品編號'],['name','品名'],['spec','規格'],['brand','品牌'],['unit','單位'],['min','安全庫存','number']],users:[['name','帳號'],['role','角色',['管理員','作業員','唯讀']]]};let editing;function edit(k,id,type){if(!can()||k==='users'&&!admin())return;let old=db[k].find(x=>x.id===id)||{};type=old.type||type;editing={k,id,type,old};$('modalTitle').textContent=(id?'編輯':'新增')+(k==='tx'?type+'單':{vendors:'廠商',products:'商品',users:'帳號'}[k]);let schema=k==='tx'?[['no','單號'],['vendor','廠商',db.vendors.filter(v=>v.type==='兩者皆是'||v.type===(type==='入貨'?'供應商':'客戶')).map(v=>[v.id,v.name])],['product','商品',db.products.map(p=>[p.id,p.name+' / '+p.spec])],['qty','數量','number'],['date','交易日期','date'],['note','備註']]:schemas[k];$('fields').innerHTML=schema.map(([key,label,kind])=>{let val=old[key]??(key==='date'?today():key==='no'?(type==='入貨'?'IN-':'OUT-')+Date.now():key==='min'?0:'');return `<label>${label}${Array.isArray(kind)?`<select name="${key}" required><option value="">請選擇</option>${kind.map(o=>{let [v,n]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(n)}</option>`}).join('')}</select>`:`<input name="${key}" type="${kind||'text'}" value="${esc(val)}" ${['note','contact','brand'].includes(key)?'':'required'} ${kind==='number'?`min="${key==='qty'?1:0}" step="1"`:''}>`}</label>`}).join('');$('modal').showModal()}
function validStock(ts){return db.products.every(p=>{let n=0;return ts.filter(t=>t.product===p.id).sort((a,b)=>a.date.localeCompare(b.date)||(a.type===b.type?0:a.type==='入貨'?-1:1)).every(t=>(n+=(t.type==='入貨'?1:-1)*Number(t.qty))>=0)})}$('editor').onsubmit=e=>{e.preventDefault();let {k,id,type,old}=editing;if(!can()||k==='users'&&!admin())return;let x=Object.fromEntries(new FormData(e.target));Object.keys(x).forEach(a=>x[a]=x[a].trim());x.id=id||uid();let key={vendors:'name',products:'sku',users:'name',tx:'no'}[k];if(!x[key]||db[k].some(r=>r.id!==id&&r[key].toLowerCase()===x[key].toLowerCase()))return toast('識別名稱或單號不得空白或重複');if(k==='products')x.min=Number(x.min);if(k==='tx'){x={...x,type,qty:Number(x.qty),created:old.created||today()};if(!Number.isSafeInteger(x.qty)||x.qty<1||!validStock([...db.tx.filter(t=>t.id!==id),x]))return toast('數量不合法或交易日期造成庫存不足')}if(k==='users'&&id===user.id&&x.role!=='管理員')return toast('不可變更目前管理員權限');db[k]=[...db[k].filter(r=>r.id!==id),x];if(k==='users'&&id===user.id)user=x;save();$('modal').close();render();toast('儲存成功')};function removeRow(k,id){if(!can()||k==='users'&&!admin())return;if(k==='users'&&id===user.id)return toast('不可刪除目前登入帳號');if((k==='vendors'&&db.tx.some(t=>t.vendor===id))||(k==='products'&&db.tx.some(t=>t.product===id)))return toast('已有交易紀錄，不可刪除');let next=db[k].filter(x=>x.id!==id);if(k==='tx'&&!validStock(next))return toast('刪除將造成庫存不足');if(confirm('確定刪除此筆資料？')){db[k]=next;save();render();toast('已刪除')}}function download(n,s,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportCSV(){let rows=[['單號','類型','廠商','品名','規格','數量','交易日期','建單日期','備註'],...txs().map(t=>[t.no,t.type,name(db.vendors,t.vendor),name(db.products,t.product),db.products.find(p=>p.id===t.product)?.spec,t.qty,t.date,t.created,t.note])];download('交易報表.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}async function restore(el){if(!admin()||!el.files[0])return;try{let d=JSON.parse(await el.files[0].text());if(typeof d.company!=='string'||!['vendors','products','tx','users'].every(k=>Array.isArray(d[k])&&d[k].every(x=>x&&typeof x.id==='string'&&/^[\w-]+$/.test(x.id)))||!d.users.some(u=>u.role==='管理員'))throw Error();if(!d.tx.every(t=>d.products.some(p=>p.id===t.product)&&d.vendors.some(v=>v.id===t.vendor)&&Number.isSafeInteger(t.qty)&&t.qty>0&&['入貨','出貨'].includes(t.type)))throw Error();if(confirm('以備份覆蓋目前資料？')){db=d;save();logout();toast('還原成功，請重新登入')}}catch{toast('備份格式不符')}el.value=''}
</script></body></html>
